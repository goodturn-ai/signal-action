name: Test
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  smoke:
    # Runs the action from this checkout in a repo with no Python dependency
    # files, which is what most consumer repos look like.
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./
